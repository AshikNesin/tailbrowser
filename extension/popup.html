<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>tailbrowser</title>
  <link rel="icon" href="icons/icon-32.png">
  <style>
    /* palette: Tailscale-inspired warm neutrals + the icon's muted brick accent */
    :root {
      --bar: #1f1e1e;
      --bar-text: #f9f7f6;
      --bar-muted: #a8a5a3;
      --bg: #f9f7f6;
      --card: #ffffff;
      --border: #e8e4e1;
      --text: #1f1e1e;
      --muted: #706e6d;
      --faint: #a8a5a3;
      --accent: #b8554c;
      --accent-soft: #f6e9e7;
      --primary: #1f1e1e;
      --primary-text: #f9f7f6;
      --ok: #7cc595;
      --warn: #e2a64a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bar: #161515;
        --bg: #1f1e1e;
        --card: #272625;
        --border: #393736;
        --text: #f9f7f6;
        --muted: #a8a5a3;
        --faint: #706e6d;
        --accent: #d0766c;
        --accent-soft: #3a2725;
        --primary: #f9f7f6;
        --primary-text: #1f1e1e;
      }
    }

    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0;
      font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hidden { display: none !important; }
    button { font: inherit; color: inherit; }
    input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ---------- header band ---------- */
    header { background: var(--bar); color: var(--bar-text); padding: 14px 16px 12px; }
    .brand-row { display: flex; align-items: center; gap: 9px; }
    .logo { width: 26px; height: 26px; display: block; }
    .brand { flex: 1; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--bar-muted); }
    /* connection status drawn as the icon's tail: three dots, smallest first */
    .tail { display: inline-flex; align-items: center; gap: 3px; }
    .tail i { display: block; border-radius: 50%; background: currentColor; opacity: .8; }
    .tail i:nth-child(1) { width: 4px; height: 4px; }
    .tail i:nth-child(2) { width: 5px; height: 5px; animation-delay: .2s; }
    .tail i:nth-child(3) { width: 7px; height: 7px; animation-delay: .4s; }
    .status[data-state="connected"] { color: var(--ok); }
    .status[data-state="connected"] .tail i { animation: flow 1.8s infinite both; }
    .status[data-state="connecting"] { color: var(--warn); }
    .status[data-state="connecting"] .tail i { animation: pulse 1.1s infinite both; }
    .status[data-state="revoked"] { color: #e58b81; }
    @keyframes flow { 0%, 100% { opacity: .35; } 40% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .tail i { animation: none !important; } }
    #subline { margin-top: 8px; font-size: 11px; color: var(--bar-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    main { display: flex; flex-direction: column; padding: 12px 14px 2px; }
    body[data-state="setup"] #relaySection { order: -1; } /* before setup, the relay form is all that matters */
    section { margin-bottom: 14px; }
    h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 7px 2px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

    .notice { margin: 0 0 12px; padding: 9px 11px; border-radius: 10px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
    .notice.info { background: var(--card); color: var(--muted); border: 1px dashed var(--border); }

    /* ---------- this tab ---------- */
    .share { padding: 12px; transition: border-color .15s, box-shadow .15s; }
    .share.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .tab-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .favicon { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 4px; background: var(--border); object-fit: contain; }
    .tab-text { flex: 1; min-width: 0; }
    .tab-title, .tab-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-title { font-weight: 600; }
    .tab-url { font-size: 11.5px; color: var(--muted); }
    #currentHint { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }

    .switch-label { font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .share.on .switch-label { color: var(--accent); }
    .switch { position: relative; flex: none; width: 40px; height: 23px; padding: 0; border: 0; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(17px); }
    .switch:disabled { opacity: .45; cursor: default; }

    /* ---------- scope ---------- */
    .modes { display: grid; gap: 6px; }
    .mode { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 11px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .mode:hover { border-color: var(--faint); }
    .mode[aria-checked="true"] { border-color: var(--accent); }
    .glyph { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--bg); color: var(--muted); }
    .mode[aria-checked="true"] .glyph { background: var(--accent-soft); color: var(--accent); }
    .mode-text { flex: 1; min-width: 0; }
    .mode-text b { display: block; font-weight: 650; }
    .mode-text small { display: block; font-size: 11.5px; color: var(--muted); }
    .radio { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.5px solid var(--faint); }
    .mode[aria-checked="true"] .radio { border: 5px solid var(--accent); }

    #allowlistBox { margin-top: 8px; padding: 10px 12px; }
    label { display: block; margin: 0 0 5px; font-size: 12px; font-weight: 600; }
    input, textarea { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
    textarea { min-height: 54px; resize: vertical; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; }

    /* ---------- shared tabs ---------- */
    .count { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10.5px; letter-spacing: 0; text-align: center; line-height: 16px; }
    .list { padding: 0 6px 0 12px; }
    .list .tab-row { padding: 9px 0; }
    .list .tab-row + .tab-row { border-top: 1px solid var(--border); }
    .list .empty { padding: 11px 6px 11px 0; font-size: 12px; color: var(--muted); }
    .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
    .icon-btn:hover { border-color: var(--border); color: var(--accent); }

    /* ---------- buttons ---------- */
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn { white-space: nowrap; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-weight: 600; cursor: pointer; }
    .btn:hover { border-color: var(--faint); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
    .btn.small-btn { padding: 4px 11px; font-size: 12px; }
    .link { padding: 0; border: 0; background: none; color: var(--accent); font-size: 11.5px; font-weight: 600; cursor: pointer; }

    /* ---------- relay settings ---------- */
    details { padding: 0 12px; }
    details[open] { padding-bottom: 12px; }
    details > summary { display: flex; align-items: center; gap: 8px; padding: 11px 0; list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary h2 { margin: 0; }
    details > summary::after { content: ""; flex: none; width: 7px; height: 7px; margin: 0 3px 0 2px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); }
    details[open] > summary::after { margin-top: -4px; transform: rotate(45deg); }
    #relaySummary { flex: 1; min-width: 0; overflow: hidden; font-size: 11px; color: var(--muted); text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .field + .field { margin-top: 9px; }
    .label-row { display: flex; justify-content: space-between; align-items: baseline; }

    footer { padding: 2px 14px 14px; }
    #revoke { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 9px; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }
    #revoke:hover { border-color: var(--accent); background: var(--accent-soft); }
    #revoke.resume { border-color: var(--primary); background: var(--primary); color: var(--primary-text); }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <img class="logo" src="icons/icon-small.svg" alt="">
      <div class="brand">tailbrowser</div>
      <span id="status" class="status" data-state="setup">
        <span class="tail" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="statusText">…</span>
      </span>
    </div>
    <div id="subline" class="mono">&nbsp;</div>
  </header>

  <main>
    <div id="notice" class="notice hidden" role="alert"></div>

    <section id="currentSection">
      <h2>This tab</h2>
      <div id="shareCard" class="card share">
        <div class="tab-row">
          <img id="currentIcon" class="favicon" alt="">
          <div class="tab-text">
            <div id="currentTitle" class="tab-title">…</div>
            <div id="currentUrl" class="tab-url"></div>
          </div>
          <span id="switchLabel" class="switch-label">Off</span>
          <button id="currentAction" class="switch" role="switch" aria-checked="false" aria-label="Share this tab with agents"></button>
        </div>
        <p id="currentHint" class="hidden"></p>
      </div>
    </section>

    <section>
      <h2>Agent access</h2>
      <div class="modes" role="radiogroup" aria-label="Scope">
        <button class="mode" data-scope="tab" role="radio" aria-checked="false">
          <span class="glyph"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6.5h12"/></svg></span>
          <span class="mode-text"><b>Tabs I pick</b><small>Only the tabs you share</small></span>
          <span class="radio"></span>
        </button>
        <button class="mode" data-scope="allowlist" role="radio" aria-checked="false">
          <span class="glyph"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h7M2.5 8h5M2.5 12h6"/><path d="m10.5 10 1.6 1.6 2.6-3.2"/></svg></span>
          <span class="mode-text"><b>Allowlist</b><small>Tabs that match your URL patterns</small></span>
          <span class="radio"></span>
        </button>
        <button class="mode" data-scope="full" role="radio" aria-checked="false">
          <span class="glyph"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4.5V3.6c0-1 .8-1.8 1.8-1.8h5.4c1 0 1.8.8 1.8 1.8v4.6c0 1-.8 1.8-1.8 1.8h-.7"/><rect x="2" y="5.5" width="9.5" height="8.5" rx="1.8"/></svg></span>
          <span class="mode-text"><b>Entire browser</b><small>Every tab, plus opening and closing tabs</small></span>
          <span class="radio"></span>
        </button>
      </div>
      <div id="allowlistBox" class="card hidden">
        <label for="allowlist">URL patterns, one per line (<span class="mono">*</span> matches anything)</label>
        <textarea id="allowlist" placeholder="https://app.example.com/*" spellcheck="false"></textarea>
        <div class="actions"><button id="saveAllowlist" class="btn small-btn primary">Apply</button></div>
      </div>
    </section>

    <section id="sharedSection">
      <h2>Shared tabs <span id="sharedCount" class="count hidden"></span></h2>
      <div id="sharedTabs" class="card list"></div>
    </section>

    <section id="relaySection">
      <details id="relaySettings" class="card">
        <summary><h2>Relay</h2><span id="relaySummary" class="mono"></span></summary>
        <div class="field">
          <label for="relay">Relay URL</label>
          <input type="text" id="relay" class="mono" placeholder="ws://100.x.y.z:8787" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <div class="label-row">
            <label for="token">Token</label>
            <button id="clearToken" class="link hidden" type="button">Clear saved token</button>
          </div>
          <input type="password" id="token" placeholder="Optional; leave blank if the relay is tokenless" autocomplete="off">
        </div>
        <div class="actions">
          <button id="save" class="btn primary">Save &amp; connect</button>
          <button id="discover" class="btn">Find local relay</button>
        </div>
      </details>
    </section>
  </main>

  <footer>
    <button id="revoke">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 1.5v6"/><path d="M4.2 4a5.5 5.5 0 1 0 7.6 0"/></svg>
      <span id="revokeText">Revoke agent access</span>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
